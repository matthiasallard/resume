{{ $author := hugo.Data.authors.me }}

<section class="research-interests-section">

  <h2 id="research-interests" 
    class="scroll-mt-[3rem] mb-10 text-3xl font-bold text-gray-900 dark:text-white text-center">
    Research Interests
  </h2>

  {{ with $author.interests }}
    <div class="research-interests-list">
      {{ range . }}
        <span class="research-interest-item">
          {{ . }}
        </span>
      {{ end }}
    </div>
  {{ end }}

</section>
